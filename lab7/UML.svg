<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="828" viewBox="0 0 1280 828">
<style>
  .bg { fill: #ffffff; }
  .box { fill: #fffef4; stroke: #222; stroke-width: 1.4; }
  .sep { stroke: #222; stroke-width: 1; }
  text { white-space: pre; font-family: Consolas, "DejaVu Sans Mono", monospace; fill: #111; }
  .name { font-size: 15px; font-weight: bold; text-anchor: middle; }
  .stereo { font-size: 12px; text-anchor: middle; }
  .member { font-size: 13px; }
  .abstract { font-style: italic; }
  .label { font-size: 12px; fill: #444; }
  .solid { stroke: #222; stroke-width: 1.4; fill: none; }
  .dashed { stroke: #222; stroke-width: 1.4; stroke-dasharray: 7 5; fill: none; }
  .hollow { fill: #ffffff; stroke: #222; stroke-width: 1.4; }
  .open { fill: none; stroke: #222; stroke-width: 1.4; }
</style>
